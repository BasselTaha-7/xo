<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="لعبة XO بسيطة للاعبين على نفس الجهاز.">
    <title>XO — لعبة للاعبين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>لعبة XO</h1>
        <p>لعبة للاعبين على نفس الجهاز.</p>
        <div class="game-board" role="group" aria-label="لوحة لعبة XO">
            <button class="cell" type="button" data-index="0" aria-label="الخانة 1"></button>
            <button class="cell" type="button" data-index="1" aria-label="الخانة 2"></button>
            <button class="cell" type="button" data-index="2" aria-label="الخانة 3"></button>
            <button class="cell" type="button" data-index="3" aria-label="الخانة 4"></button>
            <button class="cell" type="button" data-index="4" aria-label="الخانة 5"></button>
            <button class="cell" type="button" data-index="5" aria-label="الخانة 6"></button>
            <button class="cell" type="button" data-index="6" aria-label="الخانة 7"></button>
            <button class="cell" type="button" data-index="7" aria-label="الخانة 8"></button>
            <button class="cell" type="button" data-index="8" aria-label="الخانة 9"></button>
        </div>
        <p class="status" aria-live="polite">دور اللاعب: X</p>
        <button class="restart" type="button">إعادة اللعب</button>
    </main>
    <script src="script.js"></script>
    <div class="watermark" aria-hidden="true">Bassel Taha</div>
</body>
</html>
